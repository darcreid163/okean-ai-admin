name: Cloud Core compatible gateway checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium test runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Reproduce exact Core 0.3.5 cross-origin failure
        run: |
          unzip -q releases/wp-ai-cloud-0.3.5/wp-ai-admin-cloud-0.3.5.zip -d "$RUNNER_TEMP/cloud-browser-baseline"
          WPAI_BASELINE_SURFACE="$RUNNER_TEMP/cloud-browser-baseline/wp-ai-admin-cloud/src/Surface.php" node wp-ai-admin-cloud/tests/browser-navigation.js --baseline
      - name: Two-origin browser pairing and OAuth navigation
        run: node wp-ai-admin-cloud/tests/browser-navigation.js
      - name: Reproduce actual native 2.1.13 consent return failure
        run: |
          unzip -q releases/2.1.13/wp-ai-admin-2.1.13.zip -d "$RUNNER_TEMP/native-consent-baseline"
          WPAI_BASELINE_NATIVE_PAIRING="$RUNNER_TEMP/native-consent-baseline/okean-ai-admin/includes/class-oai-gateway-pairing.php" node wp-ai-admin-cloud/tests/native-consent-navigation.js --baseline
      - name: Actual native consent allow/deny and manual callback navigation
        run: node wp-ai-admin-cloud/tests/native-consent-navigation.js
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: cloud_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, sodium, curl
          coverage: none
      - name: PHP syntax
        run: find wp-ai-admin-cloud -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: SQLite core and process concurrency
        run: php wp-ai-admin-cloud/tests/run.php
      - name: SQLite legacy Core compatibility
        run: php wp-ai-admin-cloud/tests/compatibility.php
      - name: Frontend login cookie and redirect regression
        run: python3 wp-ai-admin-cloud/tests/frontend-session.py
      - name: Browser pairing and two-site registration
        run: php tests/browser-pairing.php
      - name: SQLite OAuth beta
        run: php wp-ai-admin-cloud/tests/oauth.php
      - name: One account many sites and shared plan
        run: php wp-ai-admin-cloud/tests/multisite-account.php
      - name: Public client offline tests
        run: python3 -m unittest discover -s public-client/tests -v
      - name: MySQL core and process concurrency
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=cloud_test
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: test-only-password
        run: |
          php wp-ai-admin-cloud/tests/run.php
          php wp-ai-admin-cloud/tests/compatibility.php
          php wp-ai-admin-cloud/tests/oauth.php
          php wp-ai-admin-cloud/tests/multisite-account.php

      - name: Package Cloud Core 0.3.6 test build
        if: matrix.php == '8.3'
        run: |
          rm -rf build
          mkdir -p build/wp-ai-admin-cloud
          cp -R wp-ai-admin-cloud/* build/wp-ai-admin-cloud/
          rm -rf build/wp-ai-admin-cloud/tests
          (cd build && zip -qr ../wp-ai-admin-cloud-0.3.6.zip wp-ai-admin-cloud)
          zip -qr public-client-0.3.2.zip public-client -x "*/__pycache__/*" "*.pyc"
      - name: Upload Cloud Core 0.3.6 test build
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: wp-ai-admin-cloud-0.3.6-test
          path: |
            wp-ai-admin-cloud-0.3.6.zip
            public-client-0.3.2.zip
          if-no-files-found: error
