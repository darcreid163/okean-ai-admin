name: Cloud Core compatible gateway checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: cloud_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, sodium, curl
          coverage: none
      - name: PHP syntax
        run: find wp-ai-admin-cloud -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: SQLite core and process concurrency
        run: php wp-ai-admin-cloud/tests/run.php
      - name: SQLite legacy Core compatibility
        run: php wp-ai-admin-cloud/tests/compatibility.php
      - name: Frontend login cookie and redirect regression
        run: python3 wp-ai-admin-cloud/tests/frontend-session.py
      - name: Browser pairing and two-site registration
        run: php tests/browser-pairing.php
      - name: SQLite OAuth beta
        run: php wp-ai-admin-cloud/tests/oauth.php
      - name: Public client offline tests
        run: python3 -m unittest discover -s public-client/tests -v
      - name: MySQL core and process concurrency
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=cloud_test
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: test-only-password
        run: |
          php wp-ai-admin-cloud/tests/run.php
          php wp-ai-admin-cloud/tests/compatibility.php
          php wp-ai-admin-cloud/tests/oauth.php

      - name: Package Cloud Core 0.3.6 test build
        if: matrix.php == '8.3'
        run: |
          rm -rf build
          mkdir -p build/wp-ai-admin-cloud
          cp -R wp-ai-admin-cloud/* build/wp-ai-admin-cloud/
          rm -rf build/wp-ai-admin-cloud/tests
          (cd build && zip -qr ../wp-ai-admin-cloud-0.3.6.zip wp-ai-admin-cloud)
          zip -qr public-client-0.3.2.zip public-client -x "*/__pycache__/*" "*.pyc"
      - name: Upload Cloud Core 0.3.6 test build
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: wp-ai-admin-cloud-0.3.6-test
          path: |
            wp-ai-admin-cloud-0.3.6.zip
            public-client-0.3.2.zip
          if-no-files-found: error
