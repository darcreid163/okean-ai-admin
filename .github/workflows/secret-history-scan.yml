name: Secret history scan

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks — all repository refs and current tree
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branch and pull-request head refs
        run: |
          set -euo pipefail
          git fetch --force --prune --tags origin \
            '+refs/heads/*:refs/remotes/origin/heads/*' \
            '+refs/pull/*/head:refs/remotes/origin/pull/*'

      - name: Install pinned Gitleaks release and verify checksum
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan every fetched Git ref and its full commit history
        run: |
          set -euo pipefail
          /tmp/gitleaks git --log-opts="--all" --redact=100 --no-banner .

      - name: Scan the checked-out working tree
        run: |
          set -euo pipefail
          /tmp/gitleaks dir --redact=100 --no-banner .
