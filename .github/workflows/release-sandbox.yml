name: Public Release Sandbox

on:
  push:
    branches:
      - codex/public-release-readiness
  pull_request:
    paths:
      - 'wp-ai-admin-cloud/**'
      - 'tests/**'
      - '.github/workflows/release-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tenant-isolation-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sodium, curl
          coverage: none
      - name: Tenant isolation release sandbox
        run: php wp-ai-admin-cloud/tests/tenant-isolation.php

  tenant-isolation-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: release-sandbox-password
          MYSQL_DATABASE: release_sandbox
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prelease-sandbox-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium, curl
          coverage: none
      - name: Tenant isolation release sandbox
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=release_sandbox
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: release-sandbox-password
        run: php wp-ai-admin-cloud/tests/tenant-isolation.php

  release-boundaries:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: release-boundary-password
          MYSQL_DATABASE: release_boundary
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prelease-boundary-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, sodium, curl
          coverage: none
      - name: Release abuse boundaries on SQLite
        run: php wp-ai-admin-cloud/tests/release-boundaries.php
      - name: Release abuse boundaries on MySQL
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=release_boundary
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: release-boundary-password
        run: php wp-ai-admin-cloud/tests/release-boundaries.php

  existing-release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sodium, curl
          coverage: none
      - name: Browser pairing isolation
        run: php tests/browser-pairing.php
      - name: Shared-plan and OAuth isolation
        run: php wp-ai-admin-cloud/tests/multisite-account.php
      - name: Core gateway regression
        run: php wp-ai-admin-cloud/tests/run.php
      - name: OAuth regression
        run: php wp-ai-admin-cloud/tests/oauth.php


  fresh-release-install:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fresh-install-password
          MYSQL_DATABASE: fresh_release
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfresh-install-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, sodium, curl
          coverage: none
      - name: Build installable release ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^define('OAI_VERSION','\([^']*\)').*/\1/p" okean-ai-admin.php | head -n1)"
          mkdir -p dist/okean-ai-admin
          cp -a okean-ai-admin.php includes starter-themes README.md README.txt BUILD-SIGNATURE.txt BUILD_SIGNATURE.txt dist/okean-ai-admin/
          (cd dist && zip -qr "wp-ai-admin-$VERSION.zip" okean-ai-admin)
          unzip -tq "dist/wp-ai-admin-$VERSION.zip"
      - name: Fresh WordPress install from generated ZIP
        shell: bash
        run: |
          set -euo pipefail
          WP_DIR="$RUNNER_TEMP/wpai-fresh-release"
          WPCLI="$RUNNER_TEMP/wp-cli.phar"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$WPCLI"
          mkdir -p "$WP_DIR"
          php "$WPCLI" --path="$WP_DIR" core download
          php "$WPCLI" --path="$WP_DIR" config create --dbname=fresh_release --dbuser=root --dbpass=fresh-install-password --dbhost=127.0.0.1 --skip-check
          php "$WPCLI" --path="$WP_DIR" core install --url=http://fresh-release.test --title='Fresh Release' --admin_user=release-admin --admin_password=disposable-release-password --admin_email=release@example.test --skip-email
          ZIP="$(ls "$GITHUB_WORKSPACE"/dist/wp-ai-admin-*.zip | head -n1)"
          php "$WPCLI" --path="$WP_DIR" plugin install "$ZIP" --activate
          php "$WPCLI" --path="$WP_DIR" eval-file "$GITHUB_WORKSPACE/tests/wordpress-release-install.php"

  release-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Secret and private-key guard
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- ':!tests/**' ':!**/tests/**'; then
            echo 'Private key material detected in tracked release source'; exit 1
          fi
          if git grep -n -E -- '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9_-]{32,})' -- ':!tests/**' ':!**/tests/**'; then
            echo 'Credential-like token detected in tracked release source'; exit 1
          fi
          echo 'No release-source private keys or common credential tokens detected'
      - name: Version and build metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          HEADER_VERSION="$(sed -n 's/^ \* Version: //p' okean-ai-admin.php | head -n1)"
          CONST_VERSION="$(sed -n "s/^define('OAI_VERSION','\([^']*\)').*/\1/p" okean-ai-admin.php | head -n1)"
          BUILD_ID="$(sed -n "s/^define('OAI_BUILD_ID','\([^']*\)').*/\1/p" okean-ai-admin.php | head -n1)"
          SIG_VERSION="$(sed -n 's/^Version: //p' BUILD-SIGNATURE.txt | head -n1)"
          SIG_BUILD="$(sed -n 's/^Build ID: //p' BUILD-SIGNATURE.txt | head -n1)"
          SIG2_VERSION="$(sed -n 's/^Version: //p' BUILD_SIGNATURE.txt | head -n1)"
          SIG2_BUILD="$(sed -n 's/^Build ID: //p' BUILD_SIGNATURE.txt | head -n1)"
          test -n "$HEADER_VERSION" -a "$HEADER_VERSION" = "$CONST_VERSION"
          test "$CONST_VERSION" = "$SIG_VERSION"
          test "$CONST_VERSION" = "$SIG2_VERSION"
          test "$BUILD_ID" = "$SIG_BUILD"
          test "$BUILD_ID" = "$SIG2_BUILD"
          cmp -s BUILD-SIGNATURE.txt BUILD_SIGNATURE.txt
          echo "Metadata consistent: version=$CONST_VERSION build=$BUILD_ID"
      - name: Build native release candidate and prove reproducibility
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^define('OAI_VERSION','\([^']*\)').*/\1/p" okean-ai-admin.php | head -n1)"
          test -n "$VERSION"
          rm -rf dist dist-rebuild
          for ROOT in dist dist-rebuild; do
            mkdir -p "$ROOT/okean-ai-admin"
            cp -a okean-ai-admin.php includes starter-themes README.md README.txt BUILD-SIGNATURE.txt BUILD_SIGNATURE.txt "$ROOT/okean-ai-admin/"
            find "$ROOT/okean-ai-admin" -type f -exec touch -r okean-ai-admin.php {} +
            (cd "$ROOT" && zip -X -qr "wp-ai-admin-$VERSION.zip" okean-ai-admin)
            unzip -tq "$ROOT/wp-ai-admin-$VERSION.zip"
          done
          SHA="$(sha256sum "dist/wp-ai-admin-$VERSION.zip" | awk '{print $1}')"
          SHA2="$(sha256sum "dist-rebuild/wp-ai-admin-$VERSION.zip" | awk '{print $1}')"
          test "$SHA" = "$SHA2"
          cmp -s "dist/wp-ai-admin-$VERSION.zip" "dist-rebuild/wp-ai-admin-$VERSION.zip"
          printf 'commit=%s\nversion=%s\nsha256=%s\nreproducible=true\n' "$GITHUB_SHA" "$VERSION" "$SHA" | tee dist/PROVENANCE.txt
          test "$(unzip -Z1 "dist/wp-ai-admin-$VERSION.zip" | grep -Ec '(^|/)tests?/')" -eq 0
          test "$(unzip -Z1 "dist/wp-ai-admin-$VERSION.zip" | grep -Ec '(^|/)\.git')" -eq 0
      - name: Upload release provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-release-provenance
          path: |
            dist/wp-ai-admin-*.zip
            dist/PROVENANCE.txt
          if-no-files-found: error
