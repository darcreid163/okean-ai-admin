name: Native validation
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Require tag to match Native source version
        if: startsWith(github.ref, 'refs/tags/')
        run: bash tools/native-release.sh validate
      - name: Offline release tag and immutable asset guards
        run: python3 tests/native-release-guards.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP lint
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Public combined-source security boundary
        run: php tests/monorepo-security-gate.php
      - name: Native-only publication boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/wpai-public-native"
          mkdir -p "$ROOT/tests"
          cp -a okean-ai-admin.php includes starter-themes README.md README.txt LICENSE THIRD-PARTY.md AGENTS.md MIGRATION-STATUS.md BUILD-SIGNATURE.txt BUILD_SIGNATURE.txt .gitignore "$ROOT/"
          cp tests/repository-boundary.php "$ROOT/tests/"
          php "$ROOT/tests/repository-boundary.php"
      - name: Elementor schema/save lifecycle
        run: php tests/elementor-schema-save-stage1.php
      - name: Elementor schema/save adversarial gaps (Issue #3)
        run: php tests/elementor-schema-save-gap-repro.php
      - name: Elementor single-source
        run: php tests/elementor-single-source.php
      - name: WooCommerce stock
        run: php tests/woocommerce-stock-rounding.php
      - name: Option normalization
        run: php tests/option-normalization.php
      - name: Control plane entitlements
        run: php tests/control-plane-entitlements.php
      - name: Expanded read-only CLI commands (Tier B)
        run: php tests/cli-expanded-commands.php
      - name: Abilities opt-in discovery contract
        run: php tests/abilities-discovery.php

  wordpress-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: pinned-compat
            image_editor: WP_Image_Editor_GD
            wp: '7.0.6'
            elementor: '4.3.3'
            woo: '11.1.2'
          - profile: latest-compat
            image_editor: WP_Image_Editor_Imagick
            wp: latest
            elementor: latest
            woo: latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: wp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, curl, sodium, gd, imagick
          coverage: none
      - name: Real WordPress + Elementor, WooCommerce and Gutenberg acceptance
        env:
          WP_TEST_VERSION: ${{ matrix.wp }}
          ELEMENTOR_TEST_VERSION: ${{ matrix.elementor }}
          WOO_TEST_VERSION: ${{ matrix.woo }}
          OAI_MEDIA_TEST_EDITOR: ${{ matrix.image_editor }}
        run: bash tests/wordpress-native-smoke.sh

  build-artifact:
    # Installable ZIP is produced here and never committed: tests/repository-boundary.php
    # rejects committed archives, and a release asset is the distributable unit.
    runs-on: ubuntu-latest
    needs: [php, wordpress-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Build installable ZIP and checksums
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^define('OAI_VERSION','\([^']*\)').*/\1/p" okean-ai-admin.php | head -n1)"
          test -n "$VERSION"
          mkdir -p dist/okean-ai-admin
          cp -a okean-ai-admin.php includes starter-themes README.md README.txt LICENSE THIRD-PARTY.md BUILD-SIGNATURE.txt BUILD_SIGNATURE.txt dist/okean-ai-admin/
          # Keep historical unregistered Elementor QA implementation in Git only;
          # it is absent from the verified 86-file Native 2.1.17 artifact.
          rm -f dist/okean-ai-admin/includes/class-oai-elementor-schema-save.php
          test ! -e dist/okean-ai-admin/includes/class-oai-elementor-schema-save.php
          (cd dist && zip -qr "wp-ai-admin-$VERSION.zip" okean-ai-admin)
          cd dist
          sha256sum "wp-ai-admin-$VERSION.zip" > "wp-ai-admin-$VERSION.zip.sha256"
          unzip -tq "wp-ai-admin-$VERSION.zip"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cat "wp-ai-admin-$VERSION.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wp-ai-admin-${{ env.VERSION }}
          path: |
            dist/wp-ai-admin-*.zip
            dist/wp-ai-admin-*.zip.sha256
          if-no-files-found: error

  release:
    # Publishing requires a separately authorized, exact version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [php, wordpress-smoke, build-artifact]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/native-release.sh publish
