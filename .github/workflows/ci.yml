name: AI Admin CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name "*.php" -not -path "./.git/*" -print0 |
            xargs -0 -n1 php -l

  powershell-syntax:
    name: PowerShell smoke syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse OAuth/MCP smoke script
        shell: pwsh
        run: |
          $path = "tools/oai-mcp-oauth-smoke.ps1"
          if (-not (Test-Path $path)) { throw "Missing $path" }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "PASS PowerShell parser: $path"


  release-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: [php-lint, powershell-syntax]
    steps:
      - uses: actions/checkout@v4
      - name: Verify 2.0.19 release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Version: 2.0.19" okean-ai-admin.php
          grep -q "define('OAI_VERSION','2.0.19')" okean-ai-admin.php
          grep -q "2.0.19-chatgpt-mcp-oauth-cimd-20260924" okean-ai-admin.php
          grep -q "AI Admin 2.0.19" BUILD_SIGNATURE.txt
          grep -q "# Revision: 2.0.19-r2" tools/oai-mcp-oauth-smoke.ps1
      - name: Build clean plugin ZIP and smoke file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/okean-ai-admin
          rsync -a ./ build/okean-ai-admin/ --exclude='.git' --exclude='.github' --exclude='tools' --exclude='build' --exclude='*.zip'
          (cd build && zip -qr okean-ai-admin-2.0.19.zip okean-ai-admin)
          cp tools/oai-mcp-oauth-smoke.ps1 build/oai-mcp-oauth-smoke-2.0.19-r2.ps1
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: okean-ai-admin-2.0.19
          path: build/okean-ai-admin-2.0.19.zip
          if-no-files-found: error
      - name: Upload OAuth smoke
        uses: actions/upload-artifact@v4
        with:
          name: oai-mcp-oauth-smoke-2.0.19-r2
          path: build/oai-mcp-oauth-smoke-2.0.19-r2.ps1
          if-no-files-found: error
