name: AI Admin CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name "*.php" -not -path "./.git/*" -print0 |
            xargs -0 -n1 php -l

  powershell-syntax:
    name: PowerShell smoke syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse OAuth/MCP smoke script
        shell: pwsh
        run: |
          $path = "tools/oai-mcp-oauth-smoke.ps1"
          if (-not (Test-Path $path)) { throw "Missing $path" }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "PASS PowerShell parser: $path"
