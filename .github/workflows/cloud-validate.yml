name: Cloud Core 0.3.13-dev validation (restored 0.3.11 baseline)
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-0313-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: wpai_cloud_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: wp-ai-admin-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, mysqli, sodium, curl
          coverage: none
      - name: Cloud PHP lint
        shell: bash
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Source SHA and standalone policy contract
        run: |
          php tests/recovered-runtime-hashes.php
          php tests/policy-preflight-static.php
          php tests/abilities-read-contract.php
          php tests/abilities-transport-boundary.php
          php tests/artifact-integrity.php
      - name: Deterministic candidate ZIP and provenance regression
        run: python3 tests/artifact-reproducibility.py
      - name: SQLite migration OAuth, tenant isolation, billing Batch
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for t in run compatibility quota-migration-v4 batch-accounting-v2 abilities-cloud-acceptance multisite-account oauth cross-account-isolation tier-a; do
            echo "=== SQLite $t ==="
            if php "tests/$t.php"; then
              echo "PASS SQLite $t"
            else
              echo "FAIL SQLite $t"
              failed=1
            fi
          done
          exit "$failed"
      - name: MySQL migration OAuth, tenant isolation, billing Batch
        shell: bash
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=wpai_cloud_test
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: ci-test-only
        run: |
          set -uo pipefail
          failed=0
          for t in run compatibility quota-migration-v4 batch-accounting-v2 abilities-cloud-acceptance multisite-account oauth cross-account-isolation tier-a; do
            echo "=== MySQL $t ==="
            if php "tests/$t.php"; then
              echo "PASS MySQL $t"
            else
              echo "FAIL MySQL $t"
              failed=1
            fi
          done
          exit "$failed"

  cloud-artifact:
    runs-on: ubuntu-latest
    needs: [cloud-contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build candidate Cloud ZIP (never deploy)
        shell: bash
        run: |
          set -euo pipefail
          test -f wp-ai-admin-cloud/wp-ai-admin-cloud.php
          grep -Fq "define('WPAI_CLOUD_VERSION', '0.3.13-dev')" wp-ai-admin-cloud/wp-ai-admin-cloud.php
          php wp-ai-admin-cloud/tests/recovered-runtime-hashes.php
          python3 wp-ai-admin-cloud/tools/build-candidate.py --output dist/cloud-candidate
          unzip -tq dist/cloud-candidate/wp-ai-admin-cloud-0.3.13-dev.zip
          (cd dist/cloud-candidate && sha256sum -c wp-ai-admin-cloud-0.3.13-dev.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: wp-ai-admin-cloud-0.3.13-dev-candidate
          path: |
            dist/cloud-candidate/wp-ai-admin-cloud-0.3.13-dev.zip
            dist/cloud-candidate/wp-ai-admin-cloud-0.3.13-dev.zip.sha256
            dist/cloud-candidate/PROVENANCE.json
          if-no-files-found: error
