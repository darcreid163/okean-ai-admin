name: AI Admin Static Audit

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Static safety audit
        run: php tools/oai-static-audit.php
      - name: WP-CLI parser and registry contract tests
        run: php tools/oai-cli-contract-test.php


  powershell-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse runtime smoke scripts
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw tools/oai-runtime-smoke.ps1))
          [void][scriptblock]::Create((Get-Content -Raw tools/oai-mcp-runtime-smoke.ps1))
          Write-Host "PowerShell runtime smoke scripts syntax: PASS"
