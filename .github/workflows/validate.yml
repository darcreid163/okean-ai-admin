name: Validate WP AI Admin

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint-and-archive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          test "$count" -eq 68
      - name: Version consistency
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $s=file_get_contents("okean-ai-admin.php");
            if (!preg_match("/\\* Version:\\s*([0-9]+\\.[0-9]+\\.[0-9]+)/", $s, $h)) { fwrite(STDERR, "Plugin header version missing\\n"); exit(1); }
            if (!preg_match("/define\\(\\x27OAI_VERSION\\x27,\\x27([^\\x27]+)\\x27\\)/", $s, $v)) { fwrite(STDERR, "OAI_VERSION missing\\n"); exit(1); }
            if (!preg_match("/define\\(\\x27OAI_BUILD_ID\\x27,\\x27([^\\x27]+)\\x27\\)/", $s, $b)) { fwrite(STDERR, "OAI_BUILD_ID missing\\n"); exit(1); }
            if ($h[1] !== $v[1]) { fwrite(STDERR, "Header/OAI_VERSION mismatch\\n"); exit(1); }
            if (strpos($b[1], $v[1]."-") !== 0) { fwrite(STDERR, "Build ID/version mismatch\\n"); exit(1); }
            foreach (array("BUILD-SIGNATURE.txt","BUILD_SIGNATURE.txt") as $signatureFile) {
              $sig=file_get_contents($signatureFile);
              if (!preg_match("/^Version:\\s*(.+)$/m", $sig, $sv) || trim($sv[1]) !== $v[1]) { fwrite(STDERR, $signatureFile." version mismatch\\n"); exit(1); }
              if (!preg_match("/^Build ID:\\s*(.+)$/m", $sig, $sb) || trim($sb[1]) !== $b[1]) { fwrite(STDERR, $signatureFile." build ID mismatch\\n"); exit(1); }
            }
            file_put_contents(getenv("GITHUB_ENV"), "PLUGIN_VERSION=".$v[1]."\\n", FILE_APPEND);
            echo "Validated version ".$v[1]." build ".$b[1]."\\n";
          '
      - name: Signed entitlement contract
        run: php tests/control-plane-entitlements.php
      - name: Elementor single source and fragment edits
        run: php tests/elementor-single-source.php
      - name: Plugin ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/okean-ai-admin
          cp -a okean-ai-admin.php includes starter-themes README.md README.txt BUILD-SIGNATURE.txt BUILD_SIGNATURE.txt dist/okean-ai-admin/
          (cd dist && zip -qr okean-ai-admin.zip okean-ai-admin)
          unzip -tq dist/okean-ai-admin.zip
      - name: Publish installable ZIP to branch
        if: matrix.php == '8.3' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          : "${PLUGIN_VERSION:?PLUGIN_VERSION is required}"
          git fetch origin "${GITHUB_REF_NAME}"
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "Branch advanced during validation; skipping stale ZIP publication. A newer run will publish its matching artifact."
            exit 0
          fi

          release_dir="releases/${PLUGIN_VERSION}"
          release_zip="${release_dir}/wp-ai-admin-${PLUGIN_VERSION}.zip"
          mkdir -p "$release_dir"
          cp dist/okean-ai-admin.zip "$release_zip"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$release_zip"

          if git diff --cached --quiet; then
            echo "ZIP already published for ${PLUGIN_VERSION}"
            exit 0
          fi

          git commit -m "Publish WP AI Admin ${PLUGIN_VERSION} ZIP [skip ci]"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Branch advanced after validation; skipping stale ZIP publication instead of rebasing an older artifact."
            exit 0
          fi

  batch-mutex-concurrency:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Two independent PHP requests compete for the same lock
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test-password
          DB_NAME: wp_test
        run: php tests/batch-mutex-concurrency.php
      - name: OAuth schema upgrade and registered client retention
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test-password
          DB_NAME: wp_test
        run: php tests/oauth-schema-upgrade.php
