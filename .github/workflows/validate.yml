name: Validate WP AI Admin

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint-and-archive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          test "$count" -eq 57
      - name: Plugin ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/okean-ai-admin
          cp -a okean-ai-admin.php includes starter-themes releases README.md README.txt BUILD-SIGNATURE.txt BUILD_SIGNATURE.txt dist/okean-ai-admin/
          (cd dist && zip -qr okean-ai-admin.zip okean-ai-admin)
          unzip -tq dist/okean-ai-admin.zip
