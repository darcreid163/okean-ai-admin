name: Validate WP AI Admin

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint-and-archive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          test "$count" -eq 77
      - name: Reproduce early bootstrap save on 2.1.5
        shell: bash
        run: |
          set -euo pipefail
          unzip -q releases/2.1.5/wp-ai-admin-2.1.5.zip -d "$RUNNER_TEMP/upgrade-baseline"
          if OAI_TEST_IMPLEMENTATION="$RUNNER_TEMP/upgrade-baseline/okean-ai-admin/includes/class-oai-test-automation.php" php tests/upgrade-bootstrap.php > "$RUNNER_TEMP/upgrade-baseline.log" 2>&1; then
            echo 'ERROR: baseline should fail'; exit 1
          fi
          grep -F 'Post saved before dependent plugins initialized' "$RUNNER_TEMP/upgrade-baseline.log"
      - name: Upgrade bootstrap guard and listener failure
        run: php tests/upgrade-bootstrap.php
      - name: Signed entitlement contract
        run: php tests/control-plane-entitlements.php
      - name: Elementor single source and fragment edits
        run: php tests/elementor-single-source.php
      - name: Option normalization and rollback planning
        run: php tests/option-normalization.php
      - name: WooCommerce integer stock rounding
        run: php tests/woocommerce-stock-rounding.php
      - name: Plugin ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/okean-ai-admin
          cp -a okean-ai-admin.php includes starter-themes README.md README.txt BUILD-SIGNATURE.txt BUILD_SIGNATURE.txt dist/okean-ai-admin/
          (cd dist && zip -qr okean-ai-admin.zip okean-ai-admin)
          unzip -tq dist/okean-ai-admin.zip

  batch-mutex-concurrency:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Two independent PHP requests compete for the same lock
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test-password
          DB_NAME: wp_test
        run: php tests/batch-mutex-concurrency.php
      - name: OAuth schema upgrade and registered client retention
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test-password
          DB_NAME: wp_test
        run: php tests/oauth-schema-upgrade.php


  wordpress-boot-upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: site-public-versions
            wp: '7.0.6'
            php: '8.3.33'
            woo: '11.1.2'
            elementor: '4.3.3'
            yoast: '28.6'
          - profile: latest-public-versions
            wp: latest
            php: '8.3'
            woo: latest
            elementor: latest
            yoast: latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
      - name: Real WordPress with WooCommerce, Elementor and Yoast
        env:
          WP_TEST_VERSION: ${{ matrix.wp }}
          WOO_TEST_VERSION: ${{ matrix.woo }}
          ELEMENTOR_TEST_VERSION: ${{ matrix.elementor }}
          YOAST_TEST_VERSION: ${{ matrix.yoast }}
        run: bash tests/wordpress-upgrade.sh

  publish-archive:
    if: github.event_name != 'pull_request'
    needs: [php-lint-and-archive, batch-mutex-concurrency, wordpress-boot-upgrade]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build checked installable ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/okean-ai-admin
          cp -a okean-ai-admin.php includes starter-themes README.md README.txt BUILD-SIGNATURE.txt BUILD_SIGNATURE.txt dist/okean-ai-admin/
          (cd dist && zip -qr okean-ai-admin.zip okean-ai-admin)
          unzip -tq dist/okean-ai-admin.zip
      - name: Publish installable ZIP to branch
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^define('OAI_VERSION','\\([^']*\\)').*/\\1/p" okean-ai-admin.php | head -n1)"
          test -n "$VERSION"
          mkdir -p "releases/$VERSION"
          cp dist/okean-ai-admin.zip "releases/$VERSION/wp-ai-admin-$VERSION.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/$VERSION/wp-ai-admin-$VERSION.zip"
          if git diff --cached --quiet; then
            echo "ZIP already published"
          else
            git commit -m "Publish WP AI Admin $VERSION ZIP [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
