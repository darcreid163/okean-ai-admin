name: Validate WP AI Admin

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  php-lint-and-archive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          test "$count" -eq 67
      - name: Signed entitlement contract
        run: php tests/control-plane-entitlements.php
      - name: Elementor single source and fragment edits
        run: php tests/elementor-single-source.php
      - name: Plugin ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/okean-ai-admin
          cp -a okean-ai-admin.php includes starter-themes README.md README.txt BUILD-SIGNATURE.txt BUILD_SIGNATURE.txt dist/okean-ai-admin/
          (cd dist && zip -qr okean-ai-admin.zip okean-ai-admin)
          unzip -tq dist/okean-ai-admin.zip
      - name: Publish installable ZIP to branch
        if: matrix.php == '8.3' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/2.0.70
          cp dist/okean-ai-admin.zip releases/2.0.70/wp-ai-admin-2.0.70.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/2.0.70/wp-ai-admin-2.0.70.zip
          if git diff --cached --quiet; then
            echo "ZIP already published"
          else
            git commit -m "Publish WP AI Admin 2.0.70 ZIP [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

  batch-mutex-concurrency:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Two independent PHP requests compete for the same lock
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test-password
          DB_NAME: wp_test
        run: php tests/batch-mutex-concurrency.php
      - name: OAuth schema upgrade and registered client retention
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test-password
          DB_NAME: wp_test
        run: php tests/oauth-schema-upgrade.php
